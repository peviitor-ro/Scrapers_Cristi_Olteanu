name: Repair scrapers with no jobs (daily)

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.repository.fork == false }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore empty-jobs cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: empty-jobs-${{ runner.os }}-${{ github.run_id }}
          restore-keys: empty-jobs-${{ runner.os }}-

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install OpenCode
        run: |
          OPENCODE_TMP_DIR="$(mktemp -d)"
          curl -L "https://github.com/anomalyco/opencode/releases/latest/download/opencode-linux-x64.tar.gz" -o "$OPENCODE_TMP_DIR/opencode.tar.gz"
          tar -xzf "$OPENCODE_TMP_DIR/opencode.tar.gz" -C "$OPENCODE_TMP_DIR"
          sudo install "$OPENCODE_TMP_DIR/opencode" /usr/local/bin/opencode
          rm -rf "$OPENCODE_TMP_DIR"

      - name: Repair empty-jobs backlog (at most the daily budget)
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          python sites/A_OOI_main.py --repair-backlog

      - name: Save empty-jobs cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: empty-jobs-${{ runner.os }}-${{ github.run_id }}

      - name: Commit and push changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: apply empty-jobs repairs"
          git push